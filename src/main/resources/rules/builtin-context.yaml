    negative_examples:
      - "cbkKey: \"k\""
      - "key: \"Operating System-WinDomain-svc_api\""
  # CyberArk AIM WebService endpoint URL — the URL itself is a HIGH-severity finding:
  # it confirms an AIM CCP deployment and, combined with the AppID query param,
  # can be used to query the vault directly if network access allows.
  # Pattern: AIMWebService/api/Accounts (canonical CCP REST path)
  - id: 'CYBERARK_AIM_002'
    name: 'CyberArk AIM WebService Endpoint URL'
    key: 'cyberark_aim_url'
    kind: context
    severity: HIGH
    pattern: '(?i)(https?://[A-Za-z0-9._\-]{4,}/AIMWebService/api/Accounts[^"''\s<>]*)'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'CyberArk'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "fetch(\"https://vault.corp.example/AIMWebService/api/Accounts?AppID=Portal&Safe=Prod\")"
      - "\"aimUrl\":\"https://cyberark-ccp.internal/AIMWebService/api/Accounts\""
    negative_examples:
      - "https://vault.corp.example/AIMWebService/api/Users"
      - "https://vault.corp.example/PasswordVault/api/Accounts"

