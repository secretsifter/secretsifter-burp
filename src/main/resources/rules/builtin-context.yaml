  # CryptoJS call site — catches the key when passed as an inline string literal:
  # CryptoJS.AES.decrypt(ciphertext, "hardcodedKey")
  # First argument matched with [^,"'\r\n]{0,300} — handles variable names and simple
  # expressions; avoids crossing commas inside nested calls.
  # Value: any non-quote string ≥ 8 chars; isPlaceholder() filters dummy values.
  - id: 'CRYPTOJS_CALLSITE_001'
    name: 'CryptoJS Inline Secret Key (at call site)'
    key: 'cryptojs_call_key'
    kind: context
    severity: HIGH
    pattern: '(?i)CryptoJS\.(?:AES|DES|TripleDES|Rabbit|RC4)\.(?:encrypt|decrypt)\s*\(\s*(?:"[^"\r\n]{0,4000}+"|''[^''\r\n]{0,4000}+''|[^,"''\r\n]{0,300}+),\s*["''`]([^"''`\r\n]{8,}+)["''`]'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Generic (CryptoJS key)'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "CryptoJS.AES.encrypt(JSON.stringify(payload), \"Pr0d-Encrypt!0n-K3y\")"
      - "var plain = CryptoJS.AES.decrypt(cipherText, 's3cr3t-passphrase-2026').toString(CryptoJS.enc.Utf8);"
    negative_examples:
      - "CryptoJS.AES.encrypt(payload, key)"
      - "CryptoJS.SHA256(\"not a cipher call\")"
  # CryptoJS / OpenSSL AES encrypted blob — value starts with U2FsdGVkX1 (base64 of "Salted__")
  # Catches appKey, apimSubscriptionKey, clientId, appId etc. encrypted with CryptoJS.AES.
  # Using a CtxRule (runs at LIGHT+) bypasses the hasHighEntropy() /‐slash rejection
  # that silently drops all standard base64 values containing '/' characters.
  # ReDoS fix 2026-10-24: lookbehind anchors the key at an identifier start (was quadratic on long identifier runs).
  - id: 'CRYPTOJS_BLOB_001'
    name: 'CryptoJS AES Encrypted Blob (client-side encryption)'
    key: 'cryptojs_encrypted_blob'
    kind: context
    severity: HIGH
    pattern: '(?<![A-Za-z0-9_$])(?<key>["'']?[A-Za-z_$][A-Za-z0-9_$]*["'']?)\s*[:=]\s*["''](U2FsdGVkX1[A-Za-z0-9+/]{20,}={0,2})["'']'
    group: 2
    source: secretsifter
    license: MIT
    provider: 'Generic (CryptoJS key)'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
