  # CyberArk AIM (Application Identity Manager) individual config fields.
  # Each cbk* key is self-anchored so all fields in a CyberArkSetting block are
  # reported independently:
  # cbkAppId:  "APAC_ePlacement-BancaDBS_TST_App"  → vault application ID
  # cbkSafeId: "APAC_ePlacement-BancaDBS_TST"       → safe name (vault path)
  # cbkKey:    "SIT_GoogleMapKey"                    → object/credential name
  # The previous single-anchor approach only caught the first field encountered
  # after the CyberArkSetting keyword; multi-field blocks required separate matches.
  - id: 'CYBERARK_AIM_001'
    name: 'CyberArk AIM Application ID (cbkAppId)'
    key: 'cbkAppId'
    kind: context
    severity: MEDIUM
    pattern: '\bcbkAppId\s*:\s*["'']([^"''\r\n]{4,120})["'']'
    group: 1
    source: secretsifter
    license: MIT
    provider: 'CyberArk'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "cbkAppId: \"CustomerPortal-Prod\""
      - "{ cbkAppId: 'BillingSvc01' }"
    negative_examples:
      - "cbkAppId: \"ab\""
      - "appId: \"CustomerPortal-Prod\""
  - id: 'CYBERARK_AIM_003'
    name: 'CyberArk AIM Safe ID (cbkSafeId)'
    key: 'cbkSafeId'
    kind: context
    severity: MEDIUM
    pattern: '\bcbkSafeId\s*:\s*["'']([^"''\r\n]{4,120})["'']'
    group: 1
    source: secretsifter
    license: MIT
    provider: 'CyberArk'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "cbkSafeId: \"PROD-DB-Safe\""
      - "{ cbkSafeId: 'Finance_Safe' }"
    negative_examples:
      - "cbkSafeId: \"x\""
      - "safeId: \"PROD-DB-Safe\""
  - id: 'CYBERARK_AIM_004'
    name: 'CyberArk AIM Object/Key Name (cbkKey)'
    key: 'cbkKey'
    kind: context
    severity: MEDIUM
    pattern: '\bcbkKey\s*:\s*["'']([^"''\r\n]{4,120})["'']'
    group: 1
    source: secretsifter
    license: MIT
    provider: 'CyberArk'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
