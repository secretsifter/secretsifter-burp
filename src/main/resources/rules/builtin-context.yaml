# SecretSifter built-in rules. Context-gated rules: a keyword must appear near the value.
# Order is significant: rules are evaluated in file order.
# Schema: see com.secretscanner.rules.RuleLoader.
version: 1
rules:
  # AWS Secret Access Key — 40-char base62 after aws_secret keyword
  - id: 'AWS_KEY_002'
    name: 'AWS Secret Access Key'
    key: 'aws_secret_access_key'
    kind: context
    severity: HIGH
    pattern: '(?i)aws[_\-]?secret[_\-]?(?:access[_\-]?)?key[^"''<>\n]{0,30}["\'']?\s*[=:]\s*["'']?([A-Za-z0-9+/]{40})(?![A-Za-z0-9])["'']?'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'AWS'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "aws_secret_access_key = qzwENrJkxnVWrJNV2I7CD634mcfVyc+Olk2tH15V"
      - "\"AWS_SECRET_ACCESS_KEY\":\"uXyZjIJvk37CBohJjztQmiyl0A4a4mFRudPwmawC\""
    negative_examples:
      - "aws_secret_access_key = qzwENrJkxnVWrJNV2I7CD634mcfVyc+Olk2tH15"
      - "secret_access_key = \"qzwENrJkxnVWrJNV2I7CD634mcfVyc+Olk2tH15V\""
  # Azure DevOps PAT — base64 near azure devops / dev.azure.com / vsts
  # Microsoft changed PAT length in 2023: old format = 52 chars, new format = 84 chars.
  # {52,84} covers both generations. Base64 alphabet + padding = [A-Za-z0-9+/=].
  - id: 'AZURE_DEVOPS_KEY_001'
    name: 'Azure DevOps Personal Access Token'
    key: 'azure_devops_pat'
    kind: context
    severity: HIGH
    pattern: '(?i)(?:azure[_\-]?devops|dev\.azure\.com|vsts)[^"''<>\n]{0,60}["\'']?\s*[=:]\s*["'']?([A-Za-z0-9+/=]{52,84})(?![A-Za-z0-9])["'']?'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Microsoft Azure'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "AZURE_DEVOPS_PAT=uaq1ja1hNuMALFIEQMw1eJca56gaRVK0sxiEzH24djSFYoF7JK66"
      - "\"azureDevopsToken\":\"7lDLs6nGSI7SiCqhDQyCHUbENCxzFa3tQFV3gHlKnReh5hEKMDx5f7eqMswigC8gcDp2ECpOvDprMRe36vOq\""
    negative_examples:
      - "AZURE_DEVOPS_PAT=uaq1ja1hNuMALFIEQMw1eJca56gaRVK0sxiEzH24"
      - "DEVOPS_PAT=uaq1ja1hNuMALFIEQMw1eJca56gaRVK0sxiEzH24djSFYoF7JK66"
  # Snowflake credential — password/token near snowflake keyword
  - id: 'SNOWFLAKE_KEY_001'
    name: 'Snowflake Credential'
    key: 'snowflake_credential'
    kind: context
    severity: HIGH
    pattern: '(?i)snowflake[_\-]?(?:password|token|private[_\-]?key)[^"''<>\n]{0,30}["\'']?\s*[=:]\s*["'']?([A-Za-z0-9+/=_\-]{20,})(?![A-Za-z0-9])["'']?'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Snowflake'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "SNOWFLAKE_PASSWORD=\"qeC_6vOSkOhtJa09ccRUdn1H\""
      - "snowflake_token: Tn0WWn3N64v2B5amXyJTVgpeRr4Expbivi9igdqI"
    negative_examples:
      - "SNOWFLAKE_PASSWORD=\"qeC_6vOSkOht\""
      - "snowflake_user: \"qeC_6vOSkOhtJa09ccRUdn1H\""
  # Jira API token — 24-char base64 near jira/atlassian keyword
  - id: 'JIRA_KEY_001'
    name: 'Jira API Token'
    key: 'jira_api_token'
    kind: context
    severity: HIGH
    pattern: '(?i)(?:jira[^"''<>\n]{0,40}(?:api[_\-]?token|password)|atlassian\.net[^"''<>\n]{0,60}(?:api[_\-]?token|password))[^"''<>\n]{0,30}["\'']?\s*[=:]\s*["'']?([A-Za-z0-9+/=]{24})(?![A-Za-z0-9])["'']?'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Atlassian Jira'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "jira_api_token = \"nNnFsFEgjKlc51YvjCjrCaXa\""
      - "JIRA_PASSWORD=pkhjWwnaV7oB03m1CFg77jpw"
    negative_examples:
      - "jira_api_token = \"nNnFsFEgjKlc51YvjCjr\""
      - "confluence_api_token = \"nNnFsFEgjKlc51YvjCjrCaXa\""
  - id: 'OKTA_KEY_002'
    name: 'Okta API Token'
    key: 'okta_api_token'
    kind: context
    severity: HIGH
    pattern: '(?:[Oo]kta|OKTA)[\w.\-]{0,20}["'']?\s*[:=]\s*["'']?(00[A-Za-z0-9_=\-]{40})(?![A-Za-z0-9_=\-])'
    group: 1
    source: betterleaks
    license: MIT
    provider: 'Okta'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "okta_api_token = \"00r2XyfZ9jhf9B5f4Yqjn6y1vV-XHa1KAmXOQskSLq\""
      - "{\"oktaToken\": \"00r2XyfZ9jhf9B5f4Yqjn6y1vV-XHa1KAmXOQskSLq\"}"
    negative_examples:
      - "okta_api_token = \"0012345\""
  # Salesforce OAuth access token — 00D orgId + ! separator + token body
  - id: 'SALESFORCE_KEY_001'
    name: 'Salesforce OAuth Access Token'
    key: 'salesforce_oauth_token'
    kind: context
    severity: HIGH
    pattern: '(?i)(?:salesforce|sfdc|instance_url)[^"''<>\n]{0,60}["'']?\s*[=:]\s*["'']?(00D[A-Za-z0-9]{15}![A-Za-z0-9._\-]{20,})["'']?'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Salesforce'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "salesforce_session = \"00DrxTsRvDCU7XegSh!AQTNQKwJhxCl19VGMJy4vUK2xggabeR_thYW1QpTs1KrvcuiTWBvwf43VXQQH-\""
      - "{\"salesforce_session\":\"00DrxTsRvDCU7XegSh!AQTNQKwJhxCl19VGMJy4vUK2xggabeR_thYW1QpTs1KrvcuiTWBvwf43VXQQH-\"}"
      - "\"instance_url\":\"x\", \"sfdc_token\": \"00DgaHVBjwcrXUFGfL!22culbWsLsfBm0whky2tadCjJZO7sS_uMyyTX4Oj\""
    negative_examples:
      - "salesforce_session = \"00DrxTsRvDCU7XegSh\""
      - "session = \"00DrxTsRvDCU7XegSh!AQTNQKwJhxCl19VGMJy4vUK2xggabeR_thYW1QpTs1KrvcuiTWBvwf43VXQQH-\""
  # --- SecretSifter parity: Tier B additions ---
  # Datadog API / App key — 32-40 hex after DD_API_KEY / DD_APP_KEY / datadog keyword
  - id: 'DATADOG_KEY_001'
    name: 'Datadog API Key'
    key: 'datadog_api_key'
    kind: context
    severity: HIGH
    pattern: '(?i)(?:DD_API_KEY|DD_APP_KEY|datadog[_\-]?(?:api|app)[_\-]?key)["\'']?\s*[:=]\s*["'']?([a-f0-9]{32,40})(?![A-Za-z0-9])["'']?'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Datadog'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "DD_API_KEY=e28ff99d48144e970f961020126d78a1"
      - "\"datadog_app_key\":\"e864385ea8c00e931a69d35b2a97e555a0207656\""
    negative_examples:
      - "DD_API_KEY=e28ff99d48144e970f96"
      - "DD_SITE=e28ff99d48144e970f961020126d78a1"
  # Heroku API key — UUID near heroku / HEROKU_API_KEY keyword
  - id: 'HEROKU_KEY_001'
    name: 'Heroku API Key'
    key: 'heroku_api_key'
    kind: context
    severity: HIGH
    pattern: '(?i)(?:heroku[\w.\-]{0,20}["'']?\s*[=:]\s*["'']?|HEROKU_API_KEY["'']?\s*[=:]\s*["'']?)([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?![0-9a-f])'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Heroku'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "HEROKU_API_KEY=b22d5230-b769-46d4-af70-94ad325a7e3f"
    negative_examples:
      - "HEROKU_API_KEY=b22d5230-b769-46d4-a"
      - "API_KEY=b22d5230-b769-46d4-af70-94ad325a7e3f"
    missed_examples:
      - "\"heroku\": { \"apiKey\": \"89d36c87-a25e-4ab1-a6ae-6e7777bfdab7\" }"
  # KNOWN GAP (defect F2): real server-side SDK keys are sdk-<36-char UUID>; this pattern needs 40+ chars after sdk- and never matches them. Fixed in the defect pass.
  # LaunchDarkly SDK key — sdk- prefix after launchdarkly / LD_SDK_KEY keyword
  - id: 'LAUNCHDARKLY_KEY_001'
    name: 'LaunchDarkly SDK Key'
    key: 'launchdarkly_sdk_key'
    kind: context
    severity: HIGH
    pattern: '(?i)(?:launchdarkly|LD_SDK_KEY)[^"''<>\n]{0,80}["'']?[=:\s]+["'']?(sdk-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?![0-9a-f])'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'LaunchDarkly'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "LD_SDK_KEY=\"sdk-7f45bc07-4b2c-4d3e-8f4a-0b361f6882f4\""
      - "LD_SDK_KEY=sdk-21456f66-14e0-4306-a5e8-1f0cf2e12b84"
      - "launchdarkly: { sdkKey: \"sdk-f7d724c1-802a-4c76-aa22-b9a25aacda7b\" }"
  # MessageBird API key — 25 alnum after messagebird keyword
  - id: 'MESSAGEBIRD_KEY_001'
    name: 'MessageBird API Key'
    key: 'messagebird_api_key'
    kind: context
    severity: HIGH
    pattern: '(?i)messagebird[^"''<>\n]{0,60}["\'']?\s*[=:]\s*["'']?([A-Za-z0-9]{25})(?![A-Za-z0-9])["'']?'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'MessageBird'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "messagebird_api_key = \"Bl0rm8lRDw9GQyDqjDXQ0BO7P\""
      - "\"messagebirdAccessKey\":\"UyhVDwRShex7BEFvcUFK4nZzG\""
    negative_examples:
      - "messagebird_api_key = \"Bl0rm8lRDw9GQyDqjDXQ\""
      - "sms_api_key = \"Bl0rm8lRDw9GQyDqjDXQ0BO7P\""
  # Splunk HEC token — UUID after splunk / HEC_TOKEN / hec_token keyword
  - id: 'SPLUNK_KEY_001'
    name: 'Splunk HEC Token'
    key: 'splunk_hec_token'
    kind: context
    severity: HIGH
    pattern: '(?i)(?:splunk|HEC_TOKEN|hec[_\-]?token)[^"''<>\n]{0,60}["\'']?\s*[=:]\s*["'']?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?![A-Za-z0-9])["'']?'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Splunk'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "splunk_hec_token=3c08b735-19f3-480e-a684-72958b395dc4"
      - "\"HEC_TOKEN\":\"bc0aa5fe-bedf-4ccc-a169-65867a2d7a0e\""
    negative_examples:
      - "HEC_TOKEN=bc0aa5fe-bedf-4ccc-a"
      - "BUILD_ID=bc0aa5fe-bedf-4ccc-a169-65867a2d7a0e"
  # Twilio Auth Token — 32 lowercase hex after twilio...auth_token / authToken keyword
  - id: 'TWILIO_AUTH_001'
    name: 'Twilio Auth Token'
    key: 'twilio_auth_token'
    kind: context
    severity: HIGH
    pattern: '(?i)twilio[^"''<>\n]{0,30}auth[_\-]?token["'']?\s*[:=]\s*["'']([a-f0-9]{32})["'']'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Twilio'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "twilio_auth_token: \"dac674cd017a1a8be8eedf5a72951c14\""
      - "{\"TWILIO_AUTH_TOKEN\": \"1d64dee1d4be81c3e14440aec31309aa\"}"
    negative_examples:
      - "twilio_auth_token: \"af2aoyuch0iiedgnkdwlcispd4hbad7\""
      - "twilio_account: \"af2aoyuch0iiedgnkdwlcispd4hbad7q\""
  # Webex bot / access token — 85+ chars after webex...token keyword
  - id: 'WEBEX_KEY_001'
    name: 'Webex Bot Token'
    key: 'webex_bot_token'
    kind: context
    severity: HIGH
    pattern: '(?i)(?:webex|WEBEX)[^"''<>\n]{0,80}(?:access[_\-]?token|bot[_\-]?token)[^"''<>\n]{0,30}["\'']?\s*[=:]\s*["'']?([A-Za-z0-9_\-]{85,})(?![A-Za-z0-9])["'']?'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Cisco Webex'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "webex_bot_token = \"yRsIMK8Vjbk6QjRzeRRV7blbb6ZyU2_kmLM4uMnNoiPh3solgeptrruEnmJ49lBHLqvePqwcuJcHD0TUn2zaIcFCyzJXOltEFikzaeHORm5\""
      - "\"webexAccessToken\":\"V3kZ3myhHlISYu92iDYkB5ijgrzUa-wVeirHAxICeSazX6R0cCkjUC96qJjXHoQbjGqYLis2GHAYBbfofGShIhq7vO\""
    negative_examples:
      - "webex_bot_token = \"yRsIMK8Vjbk6QjRzeRRV7blbb6ZyU2_kmLM4uMnN\""
      - "slack_bot_token = \"yRsIMK8Vjbk6QjRzeRRV7blbb6ZyU2_kmLM4uMnNoiPh3solgeptrruEnmJ49lBHLqvePqwcuJcHD0TUn2zaIcFCyzJXOltEFikzaeHORm5\""
  # Azure APIM subscription key — 32-64 alnum after Ocp-Apim-Subscription-Key header
  - id: 'AZURE_APIM_001'
    name: 'Azure APIM Subscription Key'
    key: 'azure_apim_subscription_key'
    kind: context
    severity: HIGH
    pattern: '(?i)(?:Ocp-?Apim-?Subscription-?Key|ocp[_\-]?apim[_\-]?subscription[_\-]?key|subscription[_\-]?key)["\'']?\s*[:=]\s*["'']?([A-Za-z0-9]{32,64})(?![A-Za-z0-9])["'']?'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Microsoft Azure'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "Ocp-Apim-Subscription-Key: 1311d375c2391e6c554b3f456a529ef3"
      - "\"subscriptionKey\":\"c2a0b99530df4ebd1907e5e3b7f7790a\""
    negative_examples:
      - "Ocp-Apim-Subscription-Key: 1311d375c2391e6c554b"
      - "Ocp-Apim-Trace: 1311d375c2391e6c554b3f456a529ef3"
  # Azure App Insights instrumentation key (bare UUID) — requires keyword context
  # (AZURE_APP_INSIGHTS_CONN in AnchoredRules catches the full connection string)
  - id: 'AZURE_APPINSIGHTS_001'
    name: 'Azure App Insights Instrumentation Key'
    key: 'azure_app_insights_ikey'
    kind: context
    severity: LOW
    pattern: '(?i)["'']?(?:instrumentation[_\-]?key|APPINSIGHTS_INSTRUMENTATIONKEY)["'']?\s*[:=]\s*["'']?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})["'']?'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Microsoft Azure'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "\"instrumentationKey\":\"f02c3181-e25d-4ecd-afc2-799f8c5e1a34\""
      - "APPINSIGHTS_INSTRUMENTATIONKEY=d092e17b-8d47-4bbd-a595-3e6f12eaefe5"
    negative_examples:
      - "\"instrumentationKey\":\"f02c3181-e25d-4ecd-a\""
      - "\"connectionId\":\"f02c3181-e25d-4ecd-afc2-799f8c5e1a34\""
  # Azure Shared Access Signature token — sig= or SharedAccessSignature keyword
  - id: 'AZURE_SAS_001'
    name: 'Azure Shared Access Signature Token'
    key: 'azure_sas_token'
    kind: context
    severity: HIGH
    pattern: '(?i)(?:SharedAccessSignature[=\s]+(?:[^"''\s<>]{0,300}?[?&;]sig=)?|(?<![A-Za-z0-9_])sig=)([A-Za-z0-9%+/=]{30,})'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Microsoft Azure'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "https://acct.blob.core.windows.net/c/f.pdf?sv=2022-11-02&ss=b&srt=o&sp=r&se=2027-01-01&sig=sGeTxKHlBsdSv26HDfwcLN1aYy87EeK8lCmdZCFi%2FPIW5B3xwkJ%3D"
      - "SharedAccessSignature=gnJkk78rhWb2VdqVrKoy9l7b5rmBicWb/MSKoZM9pGVB"
    negative_examples:
      - "sig=sGeTxKHlBsdSv26HDfwc"
      - "sign=sGeTxKHlBsdSv26HDfwcLN1aYy87EeK8lCmdZCFi"
      - "https://api.flickr.com/services/rest?method=x&api_sig=c5755d12e1cd4a2319e93bf020d20fc8"
  # --- Additional vendor token patterns ---
  # Algolia application ID + API key pair — 10-char uppercase app ID near algolia keyword
  - id: 'ALGOLIA_KEY_001'
    name: 'Algolia Application ID'
    key: 'algolia_app_id'
    kind: context
    severity: LOW
    pattern: '(?i)algolia[^"''<>\n]{0,80}["'']?[=:\s]+["'']?((?-i:(?=[A-Z0-9]*[A-Z])[A-Z0-9]{10}))(?![A-Za-z0-9])'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Algolia'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "algoliaAppId: \"ZDTPZH1CP4\""
      - "ALGOLIA_APP_ID=FFMQF9JKC2"
    negative_examples:
      - "algoliaAppId: \"ZDTPZH1C\""
      - "appId: \"ZDTPZH1CP4\""
  # Algolia API key — 32 hex after algolia...api_key / ALGOLIA_API_KEY keyword
  - id: 'ALGOLIA_KEY_002'
    name: 'Algolia API Key'
    key: 'algolia_api_key'
    kind: context
    severity: HIGH
    pattern: '(?i)(?:algolia[^"''<>\n]{0,60}(?:api[_\-]?key|admin[_\-]?key)|ALGOLIA_API_KEY)["\'']?\s*[:=]\s*["'']?([a-f0-9]{32})(?![A-Za-z0-9])["'']?'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Algolia'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "algolia_api_key = \"2643d97d291720140a2affb5fd6d7d52\""
      - "ALGOLIA_API_KEY=84e80ae56939f99f2e65f930fd9492e2"
    negative_examples:
      - "algolia_api_key = \"2643d97d291720140a2affb5fd6d7d\""
      - "search_api_key = \"2643d97d291720140a2affb5fd6d7d52\""
  - id: 'ALGOLIA_KEY_003'
    name: 'Algolia Search-Only API Key (public)'
    key: 'algolia_search_key'
    kind: context
    severity: LOW
    pattern: '(?i)algolia[^"''<>\n]{0,60}search[_\-]?(?:only[_\-]?)?(?:api[_\-]?)?key["'']?\s*[:=]\s*["'']?([a-f0-9]{32})(?![A-Za-z0-9])'
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Algolia'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "algoliaSearchKey: \"aefa2239119e2e5c832a92e1c03b3e2e\""
      - "{\"algolia_search_api_key\": \"aefa2239119e2e5c832a92e1c03b3e2e\"}"
  # Cloudflare API token — 40-char base62url after cloudflare / CF_API_TOKEN keyword
  - id: 'CLOUDFLARE_KEY_001'
    name: 'Cloudflare API Token'
    key: 'cloudflare_api_token'
    kind: context
    severity: HIGH
    pattern: '(?i)(?:cloudflare[^"''<>\n]{0,60}(?:api[_\-]?token|token)|CF_API_TOKEN)["\'']?\s*[:=]\s*["'']?([A-Za-z0-9_\-]{40})(?![A-Za-z0-9])["'']?'
    flags: [CASE_INSENSITIVE]
    group: 1
    source: secretsifter
    license: MIT
    provider: 'Cloudflare'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
