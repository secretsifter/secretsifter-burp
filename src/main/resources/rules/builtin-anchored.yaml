      - "STRIPE_SECRET_KEY=sk_live_ZlimLIEKYF3i4mabmfMjpTVC"
    negative_examples:
      - "sk_live_ZlimLIEKYF3i4mabmfMjpTV\""
      - "sk_life_ZlimLIEKYF3i4mabmfMjpTVCTAVVgf3CiUDfEfeTAknB0CTE2DOXzTqVfJj8mJIF7smUjZYW5ULlZ6X9lmVIMFBOQQ4fw7kGGqi"
  - id: 'STRIPE_KEY_002'
    name: 'Stripe Secret Key (Test)'
    key: 'stripe_test_key'
    kind: anchored
    severity: LOW
    pattern: '\bsk_test_[A-Za-z0-9]{24,200}\b'
    source: secretsifter
    license: MIT
    provider: 'Stripe'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "const stripe = require(\"stripe\")(\"sk_test_51KLBvj1YuC61lxfGAkz828OjclW0AUqTGJs9KwmsV3yeVec9Ry2qjF2NKqEuZfyJGS6gZGcNYKYQHB7kMpwwH122OT3Qkz38t4p0\");"
      - "sk_test_KLBvj1YuC61lxfGAkz828OjclW0AUq"
    negative_examples:
