  # Discord bot token — three dot-separated base62url segments:
  # seg1: 23-28 chars (base64url-encoded user ID — no longer limited to M/N/O;
  # Discord snowflake IDs have grown beyond the range that encodes to those chars)
  # seg2: 6-7 chars (base64url-encoded token timestamp)
  # seg3: exactly 27 chars (HMAC digest)
  # Also covers MFA tokens: mfa. + 20+ base62url chars.
  # First char of seg1 restricted to [A-Za-z0-9] (not _ or -) since base64url-encoded
  # integers always start with an alphanumeric character.
  # ReDoS fix 2026-10-24: lowercase/digit lookaheads limited to the token's own characters (were \S* scans to the next whitespace: quadratic, and satisfied by text after the token).
  - id: 'DISCORD_TOKEN_001'
    name: 'Discord Bot Token'
    key: 'discord_bot_token'
    kind: anchored
    severity: HIGH
    pattern: '\b(?=[A-Za-z0-9_.\-]{0,100}?[a-z])(?=[A-Za-z0-9_.\-]{0,100}?[0-9])(?:mfa\.[A-Za-z0-9_\-]{20,}|[A-Za-z0-9][A-Za-z0-9_\-]{22,27}\.[A-Za-z0-9_\-]{6,7}\.[A-Za-z0-9_\-]{27,38})\b'
    source: secretsifter
    license: MIT
    provider: 'Discord'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "client.login(\"MTSBKmr1UGKE20tlybqXf7971u.6pDcRB.LWER6C76xRoEFJoNge2EaUOL2Pr\");"
      - "Authorization: Bot OD4wzgpaO3tXxVCMEPSoJVwShr.GhEQW7.l8XssXfeQ2YyRUYaATy2MOJz1er"
      - "DISCORD_TOKEN=MTIl09ylAibDG69yANpZdY94KT.G0pC1h.rASFg_CcMlYhcQizYkglN8CvySPPVvliBOJ6kW"
    negative_examples:
      - "MTSBKmr1UGKE20tlybqXf7971u.6pDcRB.LWER6C76xRoEFJoNge2E"
      - "ABCDEFGHIJKLMNOPQRSTUVWX.ABCDEF.ABCDEFGHIJKLMNOPQRSTUVWXYZA"
