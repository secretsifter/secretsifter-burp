# SecretSifter built-in rules. Format-anchored vendor tokens (distinctive prefix or structure).
# Order is significant: rules are evaluated in file order.
# Schema: see com.secretscanner.rules.RuleLoader.
version: 1
rules:
  - id: 'GITHUB_PAT_001'
    name: 'GitHub PAT (Classic)'
    key: 'github_pat_classic'
    kind: anchored
    severity: HIGH
    pattern: '\bghp_[A-Za-z0-9]{36}\b'
    source: secretsifter
    license: MIT
    provider: 'GitHub'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "const token = \"ghp_Ll6BVUlR0KN318G0n0otpdy30LIUkyT46Ntq\";"
      - "Authorization: token ghp_Ll6BVUlR0KN318G0n0otpdy30LIUkyT46Ntq"
    negative_examples:
      - "ghp_Ll6BVUlR0KN318G0n0otpdy30LIUkyT46Nt\""
      - "xghp_Ll6BVUlR0KN318G0n0otpdy30LIUkyT46Ntq"
  - id: 'GITHUB_PAT_002'
    name: 'GitHub OAuth Token'
    key: 'github_oauth_token'
    kind: anchored
    severity: HIGH
    pattern: '\bgho_[A-Za-z0-9]{36}\b'
    source: secretsifter
    license: MIT
    provider: 'GitHub'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "{\"access_token\":\"gho_MZjoWsY8IzVeA0urShFshXBAOz85botZu8oR\"}"
      - "GITHUB_OAUTH=gho_MZjoWsY8IzVeA0urShFshXBAOz85botZu8oR"
    negative_examples:
      - "gho_MZjoWsY8IzVeA0urShFshXBAOz85bo"
      - "Gho_MZjoWsY8IzVeA0urShFshXBAOz85botZu8oR"
  - id: 'GITHUB_PAT_003'
    name: 'GitHub Actions Token'
    key: 'github_actions_token'
    kind: anchored
    severity: HIGH
    pattern: '\bghs_[A-Za-z0-9]{36}\b'
    source: secretsifter
    license: MIT
    provider: 'GitHub'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "token: \"ghs_PL3CkRbDCpjdEZtFC6r7qLEPacM0QSffF2GT\""
      - "x-access-token:ghs_PL3CkRbDCpjdEZtFC6r7qLEPacM0QSffF2GT@github.com"
    negative_examples:
      - "ghs_PL3CkRbDCpjdEZtFC6r7qLEPacM0QSffF2G."
      - "aghs_PL3CkRbDCpjdEZtFC6r7qLEPacM0QSffF2GT"
  - id: 'GITHUB_PAT_004'
    name: 'GitHub Refresh Token'
    key: 'github_refresh_token'
    kind: anchored
    severity: HIGH
    pattern: '\bghr_(?:[A-Za-z0-9]{36}|[A-Za-z0-9]{76})\b'
    source: secretsifter
    license: MIT
    provider: 'GitHub'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "\"refresh_token\":\"ghr_0spWTKm7iGF8lTyKM5wdDPWCKxh7m5H5oYtQaH20l0q6bnMvE1qdZvEPIP3x4eLQmFB8a7VKcqxk\""
      - "ghr_0spWTKm7iGF8lTyKM5wdDPWCKxh7m5H5oYtQaH20l0q6bnMvE1qdZvEPIP3x4eLQmFB8a7VKcqxk"
      - "refresh_token=ghr_XcDduv4Us1M2sO6edloLSXHnEPncWupI2d9h"
    negative_examples:
      - "ghr_0spWTKm7iGF8lTyKM5wdDPWCKxh7m5H5oYtQaH20l0q6bnMvE1qdZvEPIP3x4eLQmFB8a7"
      - "ghr-0spWTKm7iGF8lTyKM5wdDPWCKxh7m5H5oYtQaH20l0q6bnMvE1qdZvEPIP3x4eLQmFB8a7VKcqxk"
  - id: 'GITHUB_PAT_005'
    name: 'GitHub Fine-Grained PAT'
    key: 'github_fine_pat'
    kind: anchored
    severity: HIGH
    pattern: '\bgithub_pat_[A-Za-z0-9_]{82}\b'
    source: secretsifter
    license: MIT
    provider: 'GitHub'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "const pat = \"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\";"
      - "GH_TOKEN=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"
    negative_examples:
      - "github_pat_jU8dglohSC0p0OLrfeCalaSye_Eqz_lXLoZAmbNaEpRuzXZ52RN9WiCxuAzo"
      - "github-pat_jU8dglohSC0p0OLrfeCalaSye_Eqz_lXLoZAmbNaEpRuzXZ52RN9WiCxuAzolxIwy_6u38g_dpmA8jGACe"
  - id: 'GITHUB_PAT_006'
    name: 'GitHub User-to-Server Token'
    key: 'github_user_server_token'
    kind: anchored
    severity: HIGH
    pattern: '\bghu_[A-Za-z0-9]{36}\b'
    source: betterleaks
    license: MIT
    provider: 'GitHub'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "const GITHUB_TOKEN = \"ghu_DgmN2V1JWw2te7lMxGNyFFlGXp4VEgm4n3Yc\";"
      - "{\"GITHUB_TOKEN\": \"ghu_DgmN2V1JWw2te7lMxGNyFFlGXp4VEgm4n3Yc\"}"
    negative_examples:
      - "ghu_aaaaaaaaaaaaaaaaaaaa"
  - id: 'GITLAB_PAT_001'
    name: 'GitLab Personal Access Token'
    key: 'gitlab_pat'
    kind: anchored
    severity: HIGH
    pattern: '\bglpat-[A-Za-z0-9_\-]{20,300}(?:\.[0-9a-z]{2}\.?[0-9a-z]{7,9})?(?![A-Za-z0-9_\-])'
    source: secretsifter
    license: MIT
    provider: 'GitLab'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "PRIVATE-TOKEN: glpat-DItXRoE0DswYV3KxZb9O"
      - "GITLAB_TOKEN=glpat-KDhkA7656O8iMBv52ioLXpT0flR.01.oq2qyww0q"
      - "\"gitlabToken\":\"glpat-eOctkgdFUxfljAzyYZm-\""
    negative_examples:
      - "glpat-eOctkgdFUxfljAz"
      - "glpat_eOctkgdFUxfljAzyYZm-"
  - id: 'GITLAB_PAT_002'
    name: 'GitLab Deploy Token'
    key: 'gitlab_deploy_token'
    kind: anchored
    severity: HIGH
    pattern: '\bgldt-[A-Za-z0-9\-_]{20}(?![A-Za-z0-9_\-])'
    source: secretsifter
    license: MIT
    provider: 'GitLab'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "deployToken = \"gldt-dwEUN9cdAK3Ahn6q5Npb\""
      - "gldt-dwEUN9cdAK3Ahn6q5Npb"
    negative_examples:
      - "gldt-dwEUN9cdAK3A"
      - "gldtdwEUN9cdAK3Ahn6q5Npb"
  - id: 'GITLAB_PAT_003'
    name: 'GitLab Runner / Feed / Trigger / Job Token'
    key: 'gitlab_other_token'
    kind: anchored
    severity: HIGH
    pattern: '\b(?:glrt|glft|glffct|glimt|glsoat|glagent|gloas)-[A-Za-z0-9_\-]{20,64}(?![A-Za-z0-9_\-])|\bglptt-[0-9a-f]{40}\b|\bglcbt-[0-9a-zA-Z]{1,5}_[0-9a-zA-Z_\-]{20}(?![A-Za-z0-9_\-])'
    source: betterleaks
    license: MIT
    provider: 'GitLab'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "const CI_RUNNER_TOKEN = \"glrt-SsG1FWJbJjMLeTXsnLkZ\";"
      - "{\"CI_RUNNER_TOKEN\": \"glrt-SsG1FWJbJjMLeTXsnLkZ\"}"
      - "TRIGGER=glptt-5563d006ea918023dafb7e5866bbfd6c96fff99e"
    negative_examples:
      - "glrt-short"
  - id: 'NPM_TOKEN_001'
    name: 'npm Access Token'
    key: 'npm_access_token'
    kind: anchored
    severity: HIGH
    pattern: '\bnpm_[A-Za-z0-9]{36}\b'
    source: secretsifter
    license: MIT
    provider: 'npm'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "//registry.npmjs.org/:_authToken=npm_yfpzUmCcSGcw22941NAaUf5QJHvf5CoVvDPf"
      - "\"npmToken\":\"npm_yfpzUmCcSGcw22941NAaUf5QJHvf5CoVvDPf\""
    negative_examples:
      - "npm_yfpzUmCcSGcw22941NAaUf5QJHvf5CoVvDP\""
      - "npm-yfpzUmCcSGcw22941NAaUf5QJHvf5CoVvDPf"
  - id: 'SLACK_TOKEN_001'
    name: 'Slack Bot Token'
    key: 'slack_bot_token'
    kind: anchored
    severity: HIGH
    pattern: '\bxoxb-[0-9]{8,14}-(?:[0-9]{10,13}-)?[A-Za-z0-9]{18,34}\b'
    source: secretsifter
    license: MIT
    provider: 'Slack'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "\"botToken\":\"xoxb-437255363469-9112734084827-Jqdhg0Vd0HgFXTiEmNZ2H9Su\""
      - "Authorization: Bearer xoxb-44312656440-244612834241-6IdKRJoZk3PAy4QLdU4lnPBu"
      - "SLACK_BOT_TOKEN=xoxb-59549437451-yWl92BZ4omYRSM7cQ1jHBDpq"
    negative_examples:
      - "xoxb-abc-def"
      - "xoxb-12345-short"
  - id: 'SLACK_TOKEN_002'
    name: 'Slack User Token'
    key: 'slack_user_token'
    kind: anchored
    severity: HIGH
    pattern: '\bxoxp-[0-9]{10,13}-[0-9]{10,13}-[0-9]{10,13}-[A-Za-z0-9]{32}\b'
    source: secretsifter
    license: MIT
    provider: 'Slack'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "token: \"xoxp-293149057851-196600234126-4305728627859-76A08NhCdNIo50c9A2Ax5yK0zVkNhVO5\""
      - "SLACK_USER_TOKEN=xoxp-97855786707-35471430952-636096137611-mbnsZA4ZBBe47phHqe13pKq4iFd96p0W"
    negative_examples:
      - "xoxp-293149057851-196600234126-76A08NhCdNIo50c9A2Ax5yK0zVkNhVO5"
      - "xoxp-293149057851-196600234126-4305728627859-76A08NhCdNIo50c9A2Ax"
  - id: 'SLACK_TOKEN_003'
    name: 'Slack App Token'
    key: 'slack_app_token'
    kind: anchored
    severity: HIGH
    pattern: '\bxapp-\d-[A-Z0-9]+-\d+-[a-z0-9]+\b'
    license: MIT
    source: betterleaks
    provider: 'Slack'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "const SLACK_APP_TOKEN = \"xapp-1-AEPMVY11N6Y-0865330122997-fc98403a27c6f949d9aa59181a32e8513d1b5dde3649b1222900017225d903e0\";"
      - "{\"SLACK_APP_TOKEN\": \"xapp-1-AEPMVY11N6Y-0865330122997-fc98403a27c6f949d9aa59181a32e8513d1b5dde3649b1222900017225d903e0\"}"
    negative_examples:
      - "xapp-1-tc2XVGDS1hylUQIbDqXe"
      - "xapp-x-tc2XVGDS1hylUQIbDqXeQvQYMd9RGQ"
    missed_examples:
      - "\"appToken\":\"xapp-1-V1QUC5HHM4E-708799832153059ee7479aec4fe838dcbcfd396dfe7065f0a9b95\""
  - id: 'SLACK_TOKEN_004'
    name: 'Slack Refresh / Config Token'
    key: 'slack_config_token'
    kind: anchored
    severity: HIGH
    pattern: '\bxoxe(?:\.xox[bp])?-\d-[A-Za-z0-9]{140,180}\b'
    license: MIT
    source: betterleaks
    provider: 'Slack'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "SLACK_REFRESH=\"xoxe-1-w7H7i6qMOJB1z3YJhVYA0z8YRaljqpXuFw8If9HORhPVD5cSZgTaWeGW1LE1hJWDcS153U2TBmfCIlcBv0MM60IDS2XMorxCFF1AU3IzC6tgBAkdSmazjSIg7gq1UgCCaXGaVa5EEl9ZkbEzio\""
      - "{\"config_token\": \"xoxe.xoxp-1-UExnbNkIh7SGcvSdWeSYDJpn3FHj6MiKXQjJjaEsksxqzdToBYnkh8t0GNEHIvVjJlryVenBXrMsoowDwn7kOtrCG1r3Iu1NOAqcnm4aBXLMp7Cq8MzY1T7ijI0KJv6W4eZfXhPOun81ESfUdhxEcwG9PvBT99V3OHo8\"}"
    negative_examples:
      - "xoxe-1-short"
  - id: 'STRIPE_KEY_001'
    name: 'Stripe Secret Key (Live)'
    key: 'stripe_secret_key'
    kind: anchored
    severity: HIGH
    pattern: '\bsk_live_[A-Za-z0-9]{24,200}\b'
    source: secretsifter
    license: MIT
    provider: 'Stripe'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
