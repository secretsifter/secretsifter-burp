    pattern: '(?<![A-Za-z0-9_\-.])eyJ[A-Za-z0-9_\-]{10,2048}+\.[A-Za-z0-9_\-]{2,16384}+\.[A-Za-z0-9_\-]{10,4096}+(?![A-Za-z0-9_\-])'
