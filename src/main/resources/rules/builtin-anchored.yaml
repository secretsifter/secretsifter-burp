  # btoa("clientId:secret") — OAuth Basic Auth credential pair hardcoded in frontend JS.
  # Both sides must be ≥8 chars; allows alphanumeric plus hyphen, underscore, dot, +, /
  # (covers UUID-format client IDs, base64url secrets, etc.).  The btoa("…") wrapper
  # plus colon separator provide strong anchoring — URL false-positives are impossible
  # because URLs contain "://" which would fail the single-colon split.
  # e.g. btoa("xnaxZVSMszwY4Taj5iYWOptnDsMSY6up:NQBpjpn47uKgoljE")
  # e.g. btoa("a1b2c3d4-e5f6-7890-abcd-ef1234567890:MyS3cr3t_Key.value")
  - id: 'BTOA_CREDS_001'
    name: 'OAuth Credential Pair in btoa() Call'
    key: 'btoa_oauth_creds'
    kind: anchored
    severity: HIGH
    pattern: '\bbtoa\(\s*(?:"[A-Za-z0-9\-_.+/@]{3,200}:[A-Za-z0-9\-_.+/!#$%^&*@]{8,200}"|''[A-Za-z0-9\-_.+/@]{3,200}:[A-Za-z0-9\-_.+/!#$%^&*@]{8,200}''|`[A-Za-z0-9\-_.+/@]{3,200}:[A-Za-z0-9\-_.+/!#$%^&*@]{8,200}`)\s*\)'
    source: secretsifter
    license: MIT
    provider: 'Generic (Basic auth)'
    cwe: 'CWE-798'
    owasp: 'A07:2021'
    examples:
      - "headers: { Authorization: \"Basic \" + btoa(\"MCm24JhAMddLSFKzeqVc:vqWeshL1gQwXx3ErpXi6x2L3fxODlw25\") }"
      - "btoa(\"svc-client.app:jpDQBZnbGk48FB6EEw8g3RZG\")"
      - "headers.Authorization = 'Basic ' + btoa('svc-user:Pr0dPassw0rd!');"
    negative_examples:
      - "btoa(\"ab:jpDQBZnbGk48FB6EEw8g3RZG\")"
      - "btoa(user + \":\" + pass)"
